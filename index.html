<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор перекупа</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Калькулятор перекупа</h1>
  </header>

  <section class="card auth-card" id="authCard">
    <h2 id="authTitle">Вхід у кабінет</h2>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="authPassword">Пароль</label>
        <input type="password" id="authPassword" placeholder="мінімум 6 символів" required minlength="6">
      </div>
      <p class="auth-error" id="authError"></p>
      <button type="submit" class="btn btn-primary" id="authSubmitBtn">Увійти</button>
      <p class="auth-switch">
        <span id="authSwitchText">Немає акаунта?</span>
        <a href="#" id="authSwitchLink">Зареєструватися</a>
      </p>
    </form>
  </section>

  <div id="appContent" class="hidden">
  <div class="user-bar">
    <span id="userEmailLabel"></span>
    <button class="btn btn-add-project" id="logoutBtn">Вийти</button>
  </div>

  <div class="projects-bar">
    <div class="projects-tabs" id="projectsTabs"></div>
    <button class="btn btn-add-project" id="addProjectBtn">+ Новий проект</button>
  </div>

  <main>
    <section class="card form-card">
      <h2>Додати авто</h2>
      <form id="carForm">
        <div class="field">
          <label for="carName">Назва авто</label>
          <input type="text" id="carName" placeholder="Наприклад: BMW E39" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="buyPrice">Ціна покупки</label>
            <input type="number" id="buyPrice" placeholder="0" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label for="sellPrice">Ціна продажу</label>
            <input type="number" id="sellPrice" placeholder="0" min="0" step="0.01" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Додати в історію</button>
      </form>
    </section>

    <section class="card history-card">
      <h2>Історія авто</h2>
      <div class="table-wrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Назва</th>
              <th>Покупка</th>
              <th>Продаж</th>
              <th>Чистий плюс</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
        <p id="emptyMsg" class="empty-msg">Ще немає жодного авто в цьому проекті</p>
      </div>
    </section>
  </main>

  <footer class="total-bar">
    <span>Загальний заробіток по проекту:</span>
    <span id="totalSum" class="total-sum">0 грн</span>
  </footer>
  </div>
</div>

<script type="module" src="firebase-init.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
